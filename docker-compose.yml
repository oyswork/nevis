services:
  db:
    # Plain Postgres 16 plus the pgvector extension, for semantic document search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nevis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nevis}
      POSTGRES_DB: ${POSTGRES_DB:-nevis}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # On the host, so dev data survives `down`; delete it with `just clean`.
      - ./.data/postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-start init scripts Postgres listens only on the unix socket,
      # so a socket check would report healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: Atlas applies the pending files in schema/migrations, records them in the
  # atlas_schema_revisions table and exits. The api starts only if it succeeded.
  migrate:
    image: arigaio/atlas:1.3.3
    # The "compose" env in schema/atlas.hcl reads the URLs below. The image has no shell, so
    # they can't be expanded inside `command`.
    command: ["migrate", "apply", "--env", "compose"]
    working_dir: /schema
    environment:
      ATLAS_URL: postgresql://${POSTGRES_USER:-nevis}:${POSTGRES_PASSWORD:-nevis}@db:5432/${POSTGRES_DB:-nevis}?sslmode=disable&search_path=public
      ATLAS_DEV_URL: &atlas-dev-url postgresql://${POSTGRES_USER:-nevis}:${POSTGRES_PASSWORD:-nevis}@db:5432/atlas_dev?sslmode=disable&search_path=public
    volumes:
      - ./schema:/schema:ro
    depends_on:
      db:
        condition: service_healthy

  # Tool, not part of the stack: writes a migration for the difference between
  # schema/migrations and schema/schema.sql. Only touches the scratch atlas_dev database.
  #   docker compose run --rm migrate-diff <name>
  migrate-diff:
    image: arigaio/atlas:1.3.3
    profiles: [tools]
    # Arguments to `docker compose run` (the migration name) are appended to this.
    entrypoint: ["/atlas", "migrate", "diff", "--env", "compose"]
    working_dir: /schema
    environment:
      ATLAS_DEV_URL: *atlas-dev-url
    volumes:
      - ./schema:/schema
    depends_on:
      db:
        condition: service_healthy

  # Development server: the dev image with src/ mounted from the host and auto-reload.
  api:
    build:
      context: .
      target: dev
    command: ["uvicorn", "--factory", "nevis.main:create_app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ./src:/app/src:ro
    environment:
      NEVIS_DATABASE_URL: &database-url postgresql://${POSTGRES_USER:-nevis}:${POSTGRES_PASSWORD:-nevis}@db:5432/${POSTGRES_DB:-nevis}
      # Optional cross-encoder reranking of document search (see .env.example); empty: off.
      NEVIS_SEARCH_RERANK: ${NEVIS_SEARCH_RERANK:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Summary worker: the same dev image, without the api. It summarizes documents with the local
  # model (see .env.example) and, with none configured, logs that and idles. `just logs worker`.
  # It doesn't auto-reload: after editing src/nevis/summaries, `docker compose restart worker`.
  worker:
    build:
      context: .
      target: dev
    command: ["python", "-m", "nevis.summaries.worker"]
    volumes:
      - ./src:/app/src:ro
    environment:
      NEVIS_DATABASE_URL: *database-url
      # Optional summarization model, local or hosted (see .env.example); empty: summaries stay
      # null.
      NEVIS_SUMMARY_API_URL: ${NEVIS_SUMMARY_API_URL:-}
      NEVIS_SUMMARY_MODEL: ${NEVIS_SUMMARY_MODEL:-}
      NEVIS_SUMMARY_API_KEY: ${NEVIS_SUMMARY_API_KEY:-}
    # Lets the worker reach a model running on the host (e.g. Ollama) on Linux as on macOS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
