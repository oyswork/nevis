services:
  db:
    # Plain Postgres 16 plus the pgvector extension, for semantic document search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nevis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nevis}
      POSTGRES_DB: ${POSTGRES_DB:-nevis}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-start init scripts Postgres listens only on the unix socket,
      # so a socket check would report healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: Atlas diffs the database against schema/schema.sql, applies the difference and
  # exits. The api starts only if it succeeded.
  migrate:
    image: arigaio/atlas:1.3.3
    # The "compose" env in schema/atlas.hcl reads the URLs below. The image has no shell, so
    # they can't be expanded inside `command`.
    command: ["schema", "apply", "--env", "compose", "--auto-approve"]
    working_dir: /schema
    environment:
      ATLAS_URL: postgresql://${POSTGRES_USER:-nevis}:${POSTGRES_PASSWORD:-nevis}@db:5432/${POSTGRES_DB:-nevis}?sslmode=disable&search_path=public
      ATLAS_DEV_URL: postgresql://${POSTGRES_USER:-nevis}:${POSTGRES_PASSWORD:-nevis}@db:5432/atlas_dev?sslmode=disable&search_path=public
    volumes:
      - ./schema:/schema:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      NEVIS_DATABASE_URL: postgresql://${POSTGRES_USER:-nevis}:${POSTGRES_PASSWORD:-nevis}@db:5432/${POSTGRES_DB:-nevis}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
