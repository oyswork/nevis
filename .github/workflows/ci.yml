# The same gates as before a commit: `just check` (ruff, strict mypy) and `just test` (the full
# suite in Docker against the throwaway test stack, with the 80% coverage gate), plus a smoke test
# of the production stack. On main, a passing run releases (and deploy.yml deploys a release).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      # uv installs the Python from .python-version and syncs uv.lock on the first `uv run`.
      - run: uv sync --locked
      - run: just check
      # shellcheck is preinstalled on the runner.
      - run: shellcheck deploy/*.sh scripts/*.sh

  test:
    runs-on: ubuntu-latest
    # The first build downloads the embedding models into the image.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - run: just test
      - name: Tear down the test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down --volumes

  # The release images, deploy/compose.prod.yml and deploy/migrate.sh, run together: HTTPS
  # (Caddy's internal CA), Basic auth, rate limits, migrations and a write followed by a search.
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: deploy/smoke.sh

  # On main, once every gate passes: push the release images to ghcr.io, then tag the commit
  # v<version from pyproject.toml> and publish a GitHub release for it. An already released
  # version is skipped, so bump the version in pyproject.toml to cut a new release.
  release:
    needs: [check, test, prod-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          # Image tags allow no `+`, so no build metadata (deploy/deploy.sh checks the same).
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=pyproject.toml::not a release version: $version"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists; bump the version in pyproject.toml to release"
            released=true
          else
            released=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "released=$released"
            # ghcr.io wants lowercase names; owners may have capitals.
            echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            # Links the packages to this repository and records what they were built from.
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.version=$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.released == 'false'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.released == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the api and worker image
        if: steps.version.outputs.released == 'false'
        uses: docker/build-push-action@v6
        with:
          target: runtime
          push: true
          tags: ${{ steps.version.outputs.prefix }}/nevis:${{ steps.version.outputs.version }}
          labels: ${{ steps.version.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Push the proxy image
        if: steps.version.outputs.released == 'false'
        uses: docker/build-push-action@v6
        with:
          target: proxy
          push: true
          tags: ${{ steps.version.outputs.prefix }}/nevis-proxy:${{ steps.version.outputs.version }}
          labels: ${{ steps.version.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max
      - name: Tag and release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
